version: 2

models:
  - name: stg_gitlab_issues
    description: "GitLab IssuesのステージングビューFor gitlab-devops process)"
    columns:
      - name: process_type
        description: "プロセスタイプ（gitlab-devops）"
        data_tests:
          - not_null
          - accepted_values:
              values: ["gitlab-devops"]
      - name: case_id
        description: "ケースID（gitlab-issue-{iid}形式）"
        data_tests:
          - not_null
      - name: activity
        description: "アクティビティ名"
        data_tests:
          - not_null
          - accepted_values:
              values: ["Issue Created", "Issue Closed"]
      - name: timestamp
        description: "イベント発生日時"
        data_tests:
          - not_null
      - name: source_system
        description: "ソースシステム"
        data_tests:
          - accepted_values:
              values: ["gitlab_issue"]

  - name: stg_gitlab_merge_requests
    description: "GitLab MRsのステージングビュー（gitlab-devops + hybrid-devops対応）"
    columns:
      - name: process_type
        description: "プロセスタイプ（gitlab-devops or hybrid-devops）"
        data_tests:
          - not_null
          - accepted_values:
              values: ["gitlab-devops", "hybrid-devops"]
      - name: case_id
        description: "ケースID（gitlab-devopsならgitlab-issue-{iid}、hybrid-devopsならJiraキー）"
        data_tests:
          - not_null
      - name: activity
        description: "アクティビティ名"
        data_tests:
          - not_null
          - accepted_values:
              values: ["MR Created", "Code Merged"]
      - name: timestamp
        description: "イベント発生日時"
        data_tests:
          - not_null
      - name: source_system
        description: "ソースシステム"
        data_tests:
          - accepted_values:
              values: ["gitlab_mr"]

  - name: stg_gitlab_pipelines
    description: "GitLab CI Pipelinesのステージングビュー（gitlab-devopsプロセス）"
    columns:
      - name: process_type
        description: "プロセスタイプ（gitlab-devops）"
        data_tests:
          - not_null
          - accepted_values:
              values: ["gitlab-devops"]
      - name: case_id
        description: "ケースID（gitlab-issue-{iid}形式）"
        data_tests:
          - not_null
      - name: activity
        description: "アクティビティ名"
        data_tests:
          - not_null
          - accepted_values:
              values: ["Build Started", "Build Completed", "Build Failed"]
      - name: timestamp
        description: "イベント発生日時"
        data_tests:
          - not_null
      - name: source_system
        description: "ソースシステム"
        data_tests:
          - accepted_values:
              values: ["gitlab_ci"]
