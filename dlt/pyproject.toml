[project]
name = "open-process-mining-dlt"
version = "0.1.0"
description = "Data extraction layer for open-process-mining using dlt"
requires-python = ">=3.9"
dependencies = [
    "dlt[postgres]>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
